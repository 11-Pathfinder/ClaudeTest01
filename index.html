<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Timer</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2D9C8F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pomodoro">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="top-bar">
      <h1>Pomodoro</h1>
      <span class="session-count" id="sessionCount">0 sessions</span>
    </header>

    <main class="content">
      <div class="timer-card" id="timerCard">
        <div class="mode-tabs">
          <button class="tab active" data-mode="focus">Focus</button>
          <button class="tab" data-mode="short">Short Break</button>
          <button class="tab" data-mode="long">Long Break</button>
        </div>

        <div class="timer-display" id="timerDisplay">25:00</div>
        <div class="timer-label" id="timerLabel">Time to focus</div>

        <div class="controls">
          <button class="btn btn-reset" id="btnReset" disabled>Reset</button>
          <button class="btn btn-start" id="btnStart">Start</button>
        </div>

        <label class="music-toggle" id="btnMusic">
          <svg class="music-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path class="wave wave-1" d="M2 12 Q6 8, 10 12 Q14 16, 18 12 Q20 10, 22 12"/>
            <path class="wave wave-2" d="M2 16 Q6 12, 10 16 Q14 20, 18 16 Q20 14, 22 16"/>
          </svg>
          <span class="music-label">Ocean Waves</span>
          <span class="toggle-track">
            <span class="toggle-knob"></span>
          </span>
        </label>

        <div class="duration-settings">
          <div class="duration-input">
            <label for="focusMin">Focus</label>
            <input type="number" id="focusMin" min="1" max="120" value="25">
            <span>min</span>
          </div>
          <div class="duration-input">
            <label for="shortMin">Short</label>
            <input type="number" id="shortMin" min="1" max="60" value="5">
            <span>min</span>
          </div>
          <div class="duration-input">
            <label for="longMin">Long</label>
            <input type="number" id="longMin" min="1" max="60" value="15">
            <span>min</span>
          </div>
        </div>
      </div>

      <div class="history" id="history"></div>
    </main>
  </div>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }
  </script>
</body>
</html>
